<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daan's Ice Cream Cone Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            color: #4a148c;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #7b1fa2;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .cone-display {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 1rem;
            user-select: none;
            transition: transform 0.2s;
        }

        .cone-display:hover {
            transform: scale(1.05);
        }

        .count {
            font-size: 6rem;
            font-weight: 800;
            color: #4a148c;
            margin-bottom: 0.5rem;
            transition: transform 0.15s;
        }

        .count.bump {
            transform: scale(1.2);
        }

        .label {
            font-size: 1.2rem;
            color: #6a1b9a;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-add {
            background: linear-gradient(135deg, #7c4dff, #536dfe);
            color: white;
            font-size: 1.3rem;
            padding: 1rem 2.5rem;
        }

        .btn-add:hover {
            box-shadow: 0 6px 20px rgba(124, 77, 255, 0.4);
        }

        .btn-undo {
            background: white;
            color: #7b1fa2;
            border: 2px solid #ce93d8;
        }

        .btn-undo:hover {
            background: #f3e5f5;
        }

        .btn-reset {
            background: white;
            color: #c62828;
            border: 2px solid #ef9a9a;
        }

        .btn-reset:hover {
            background: #ffebee;
        }

        .history {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #7b1fa2;
            opacity: 0.7;
        }

        .history span {
            display: inline-block;
            background: rgba(255,255,255,0.6);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin: 0.2rem;
        }

        .falling-cone {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: fall 1.5s ease-in forwards;
            z-index: 100;
        }

        @keyframes fall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
        }

        .milestone {
            margin-top: 1rem;
            padding: 0.5rem 1.2rem;
            background: linear-gradient(135deg, #fff9c4, #fff176);
            border-radius: 20px;
            font-size: 0.95rem;
            color: #f57f17;
            font-weight: 600;
            display: none;
        }

        .milestone.show {
            display: inline-block;
            animation: pop 0.4s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daan's Ice Cream Counter</h1>
        <p class="subtitle">A serious tracker for a serious habit</p>

        <div class="cone-display">🍦</div>
        <div class="count" id="count">0</div>
        <div class="label">cones consumed</div>

        <div class="buttons">
            <button class="btn-undo" onclick="undo()">Undo</button>
            <button class="btn-add" onclick="addCone()">+ Add Cone</button>
            <button class="btn-reset" onclick="resetCount()">Reset</button>
        </div>

        <div class="milestone" id="milestone"></div>

        <div class="history" id="history"></div>
    </div>

    <script>
        const STORAGE_KEY = 'daan_icecream_count';
        const HISTORY_KEY = 'daan_icecream_history';

        let count = parseInt(localStorage.getItem(STORAGE_KEY) || '0');
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

        const countEl = document.getElementById('count');
        const milestoneEl = document.getElementById('milestone');
        const historyEl = document.getElementById('history');

        const milestones = {
            5: "Getting started! 🐣",
            10: "Double digits! 🎉",
            25: "Quarter century of cones! 🏅",
            50: "Half a hundred! Legend. 🏆",
            69: "Nice. 😏",
            100: "Triple digits! Unstoppable! 🚀",
            150: "Brain freeze champion 🧊",
            200: "Two hundred! Dairy king 👑",
            365: "A cone a day! 📅",
            500: "FIVE HUNDRED 🤯",
            1000: "One thousand cones. Respect. 🐐"
        };

        function render() {
            countEl.textContent = count;
            localStorage.setItem(STORAGE_KEY, count);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-20)));
            renderHistory();
            checkMilestone();
        }

        function addCone() {
            count++;
            const now = new Date();
            history.push(now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }));

            countEl.classList.add('bump');
            setTimeout(() => countEl.classList.remove('bump'), 150);

            spawnFallingCone();
            render();
        }

        function undo() {
            if (count > 0) {
                count--;
                history.pop();
                render();
            }
        }

        function resetCount() {
            if (count === 0) return;
            if (confirm(`Reset Daan's count from ${count} back to 0?`)) {
                count = 0;
                history = [];
                milestoneEl.classList.remove('show');
                render();
            }
        }

        function checkMilestone() {
            if (milestones[count]) {
                milestoneEl.textContent = milestones[count];
                milestoneEl.classList.add('show');
            } else {
                milestoneEl.classList.remove('show');
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                historyEl.innerHTML = '';
                return;
            }
            const recent = history.slice(-5).reverse();
            historyEl.innerHTML = 'Recent: ' + recent.map(h => `<span>${h}</span>`).join('');
        }

        function spawnFallingCone() {
            const el = document.createElement('div');
            el.className = 'falling-cone';
            el.textContent = ['🍦', '🍨', '🧁', '🍧'][Math.floor(Math.random() * 4)];
            el.style.left = (Math.random() * 90 + 5) + '%';
            el.style.top = '-50px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1600);
        }

        render();
    </script>
</body>
</html>
