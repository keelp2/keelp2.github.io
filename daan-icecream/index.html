<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daan's Ice Cream Cone Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            color: #4a148c;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #7b1fa2;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .cone-display {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 1rem;
            user-select: none;
            transition: transform 0.2s;
        }

        .cone-display:hover {
            transform: scale(1.05);
        }

        .count {
            font-size: 6rem;
            font-weight: 800;
            color: #4a148c;
            margin-bottom: 0.5rem;
            transition: transform 0.15s;
        }

        .count.bump {
            transform: scale(1.2);
        }

        .label {
            font-size: 1.2rem;
            color: #6a1b9a;
            margin-bottom: 2rem;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Daan's Ice Cream Counter</h1>
        <p class="subtitle">A serious tracker for a serious habit</p>

        <div class="cone-display">🍦</div>
        <div class="count">8</div>
        <div class="label">cones consumed</div>

    </div>

</body>
</html>
