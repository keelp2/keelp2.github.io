<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Grad Applications</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ffffff'/><rect x='3' y='3' width='58' height='58' rx='11' fill='none' stroke='%234f46e5' stroke-width='2.5'/><text x='32' y='42' font-family='system-ui,sans-serif' font-size='22' font-weight='800' fill='%234f46e5' text-anchor='middle' letter-spacing='-1'>MS</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-dim: #64748b;
      --accent: #4f46e5;
      --accent-dim: #e0e7ff;
      --green: #16a34a;
      --green-dim: #dcfce7;
      --orange: #d97706;
      --orange-dim: #fef3c7;
      --yellow: #a16207;
      --yellow-dim: #fef9c3;
      --yellow-line: #facc15;
      --red: #dc2626;
      --red-dim: #fee2e2;
      --gray-dim: #e2e8f0;
      --radius: 14px;
    }

    html { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; padding: 24px 16px 64px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .wrap.wide { max-width: 1000px; }
    button, input, select, textarea { font-family: inherit; font-size: 15px; }

    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    header a.back { font-size: 13px; color: var(--text-dim); text-decoration: none; display: block; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
    .sub b { color: var(--text); }

    .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--surface2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: var(--red); }
    .btn.small { padding: 6px 10px; font-size: 13px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .seg button { border: none; background: none; padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--text-dim); cursor: pointer; }
    .seg button.on { background: var(--accent-dim); color: var(--accent); }

    /* Program list */
    .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .prog { border-bottom: 1px solid var(--border); }
    .prog:last-child { border-bottom: none; }
    .prog.decided .row { opacity: 0.6; }
    .prog.preparing .row, .prog.preparing .body { box-shadow: inset 4px 0 0 var(--yellow-line); }
    .prog.preparing .row { background: #fffdf2; }
    .prog.preparing .row:hover { background: var(--yellow-dim); }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; user-select: none; }
    .row:hover { background: var(--surface2); }
    .ring { flex: none; width: 34px; height: 34px; position: relative; }
    .ring svg { width: 34px; height: 34px; transform: rotate(-90deg); }
    .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--text-dim); }
    .ring.full span { color: var(--green); }
    .name { flex: 1; min-width: 0; }
    .name b { display: block; font-size: 15px; font-weight: 700; }
    .rank { font-style: normal; font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 2px; }
    .name span { display: block; font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .due { font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; }
    .due small { display: block; font-size: 12px; font-weight: 500; color: var(--text-dim); }
    .due.soon, .due.soon small { color: var(--orange); }
    .due.late, .due.late small { color: var(--red); }
    .due.none { color: var(--text-dim); font-weight: 500; }
    .chev { flex: none; color: var(--text-dim); transition: transform 0.15s; font-size: 18px; line-height: 1; }
    .prog.open .chev { transform: rotate(90deg); }

    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .s-researching { background: var(--gray-dim); color: #334155; }
    .s-preparing { background: var(--yellow-dim); color: var(--yellow); }
    .s-submitted, .s-interview { background: var(--accent-dim); color: var(--accent); }
    .s-admitted, .s-committed { background: var(--green-dim); color: var(--green); }
    .s-waitlisted { background: var(--orange-dim); color: var(--orange); }
    .s-rejected, .s-declined, .s-withdrawn { background: var(--red-dim); color: var(--red); }

    .body { display: none; padding: 2px 14px 14px 60px; }
    .prog.open .body { display: block; }
    .items { list-style: none; }
    .items li { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
    .items input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex: none; }
    .items label { flex: 1; cursor: pointer; }
    .items li.done label { color: var(--text-dim); text-decoration: line-through; }
    .items .del { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 16px; opacity: 0; padding: 0 4px; }
    .items li:hover .del { opacity: 1; }
    @media (hover: none) { .items .del { opacity: 0.5; } }
    .add-item { border: none; border-bottom: 1px dashed var(--border); background: none; padding: 6px 0; margin: 2px 0 0 28px; width: calc(100% - 28px); font-size: 14px; outline: none; }
    .add-item:focus { border-bottom-color: var(--accent); }

    .info { margin-top: 12px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
    .info b { color: var(--text); font-weight: 600; }
    .info .note { margin-top: 4px; }
    .recbox { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .recbox-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    .recbox-head .ok { text-transform: none; letter-spacing: 0; color: var(--green); font-weight: 600; }
    .recbox ul.rules { margin: 8px 0 0 18px; font-size: 13px; color: #334155; line-height: 1.5; }
    .recbox .note { margin-top: 6px; font-size: 13px; color: var(--orange); }
    .recpeople { margin-top: 10px; display: grid; gap: 6px; }
    .recperson { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
    .recperson b { font-weight: 600; }
    .recperson span { color: var(--text-dim); font-size: 13px; flex: 1; min-width: 120px; }
    .recperson select { border: 1px solid var(--border); border-radius: 8px; padding: 3px 6px; font-size: 13px; background: var(--surface); }
    .recperson select.st-submitted { background: var(--green-dim); color: var(--green); border-color: transparent; }
    .recperson select.st-registered { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
    .recperson select.st-agreed { background: var(--yellow-dim); color: var(--yellow); border-color: transparent; }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .actions select { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 13px; background: var(--surface); }
    .actions a { font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; }

    /* Compare table */
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); background: var(--surface2); }
    tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--surface2); }
    td.school b { display: block; }
    td.school span { color: var(--text-dim); }

    /* Essay plan */
    .essay-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
    .essay-head h2 { font-size: 16px; margin-bottom: 6px; }
    .essay-head blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--border); color: var(--text-dim); font-size: 13px; }
    .essay-head ul { margin: 6px 0 0 18px; font-size: 13px; }
    table.essay td, table.essay th { white-space: normal; vertical-align: top; }
    table.essay tbody tr { cursor: default; }
    table.essay tbody tr:hover { background: none; }
    table.essay td.n { font-weight: 700; color: var(--text-dim); }
    table.essay td.first { font-style: italic; min-width: 220px; }
    table.essay td ul { margin-left: 16px; }
    table.essay td.para { min-width: 120px; }
    table.essay td.para span { display: block; color: var(--text-dim); font-size: 12px; }
    @media (max-width: 700px) {
      table.essay thead { display: none; }
      table.essay, table.essay tbody, table.essay tr, table.essay td { display: block; width: 100%; }
      table.essay tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
      table.essay tr:last-child { border-bottom: none; }
      table.essay td { border: none; padding: 4px 14px; min-width: 0; }
      table.essay td.n { display: none; }
    }

    .empty { text-align: center; color: var(--text-dim); padding: 48px 16px; }

    dialog { border: none; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); margin: auto; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
    dialog::backdrop { background: rgba(15,23,42,0.45); }
    dialog form { padding: 20px; }
    dialog h2 { font-size: 19px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .full { grid-column: 1 / -1; }
    .grid label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); }
    .grid label small { font-weight: 500; }
    .grid .check { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 500; }
    .grid .check input { display: inline; width: auto; margin: 0; }
    .grid input, .grid select, .grid textarea { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; background: var(--surface); color: var(--text); }
    textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    footer { margin-top: 24px; font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    footer .spacer { flex: 1; }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .body { padding-left: 14px; }
      .row .pill { display: none; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="../">&larr; keelp2.github.io</a>
      <h1>Master's Applications</h1>
      <p class="sub" id="summary"></p>
    </div>
    <button class="btn primary" id="addBtn">+ Add program</button>
  </header>

  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-view="list" class="on">Checklist</button>
      <button data-view="table">Compare</button>
      <button data-view="essay">Essay plan</button>
    </div>
    <div class="seg" id="sortSeg">
      <button data-sort="deadline" class="on">By deadline</button>
      <button data-sort="rank">By rank</button>
    </div>
  </div>

  <div id="main"></div>

  <footer>
    <span>Saved in this browser. Details researched Sept 2026 — confirm anything marked “verify”.</span>
    <span class="spacer"></span>
    <button class="btn small" id="exportBtn">Export</button>
    <button class="btn small" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Add program</h2>
    <div class="grid">
      <label>School *<input name="school" required></label>
      <label>Program<input name="program" placeholder="e.g. MS Computer Science"></label>
      <label>Status<select name="status" id="statusSel"></select></label>
      <label>Format<select name="format">
        <option value="">—</option><option>In person</option><option>Online</option><option>Hybrid</option><option>In person or online</option>
      </select></label>
      <label>Deadline<input type="date" name="deadline"><span class="check"><input type="checkbox" name="deadlineEst" id="estBox"><label for="estBox">Estimated (not posted yet)</label></span></label>
      <label>Start<input name="start" placeholder="e.g. Autumn 2027"></label>
      <label>Admissions review<input name="review" list="reviewTypes" placeholder="e.g. Rolling"><datalist id="reviewTypes"><option>Rolling</option><option>Rolling, firm deadline</option><option>Rounds</option><option>Fixed deadline</option><option>Quarterly batches</option></datalist></label>
      <label>Application fee ($)<input type="number" name="fee" min="0" step="1"></label>
      <label>Cost<input name="cost" placeholder="e.g. ~$80k total"></label>
      <label>Rank <small>(your preference, 1 = top)</small><input type="number" name="rank" min="1" step="1"></label>
      <label class="full">Checklist <small>(one item per line)</small><textarea name="reqs" rows="6"></textarea></label>
      <label class="full">Program link<input type="url" name="link" placeholder="https://"></label>
      <label class="full">Note<textarea name="notes" rows="2"></textarea></label>
    </div>
    <div class="form-actions">
      <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script>
  const KEY = 'gradapps-v3';
  const OLD_KEY = 'gradapps-v2';
  const VIEW_KEY = 'gradapps-view';
  const REV_KEY = 'gradapps-seedrev';
  const SORT_KEY = 'gradapps-sort';
  const STATUSES = ['Researching', 'Preparing', 'Submitted', 'Interview', 'Admitted', 'Waitlisted', 'Rejected', 'Committed', 'Declined', 'Withdrawn'];
  const DECIDED = new Set(['Admitted', 'Waitlisted', 'Rejected', 'Committed', 'Declined', 'Withdrawn']);
  const PRE_SUBMIT = new Set(['Researching', 'Preparing']);

  // Starter list, researched Sept 2026 (requirements re-checked against program sites).
  // Loaded when nothing is saved yet; SEED_REV bumps patch it into already-saved lists.
  const SEED_REV = 31;
  const r = (...items) => items.map(t => ({ t, done: false }));
  const FINMATH_UPDATE = {
    format: 'In person or online',
    start: 'Autumn 2027 (online also Jan & Jun)',
    cost: '~$98k total (12.5 courses)',
    notes: 'Online option: live classes weekday evenings 6–9pm; part-time can be 1 course/quarter (~3 yrs). Online also starts in Jan & Jun — last cycle deadlines were Nov 6 (Jan start) and Apr 30 (Jun start). Autumn Round 1 unconfirmed: sources say Dec 3 (then Jan 14, Mar 25) or Nov 2. Needs multivariable calc, linear algebra, probability, programming.',
  };
  // Deadline research, Sept 2026. deadlineEst = not posted yet, projected from last cycle.
  // from = the starter value this replaces (so dates the user changed are left alone).
  const DEADLINE_UPDATES = {
    'seed-0': { from: '', deadline: '2026-12-01', deadlineEst: true,
      notes: 'Part-time online via the Honors Cooperative Program (HCP): same application and deadline as full-time, but you must be employed. For CS, only the AI, Information Management & Analytics, and Systems specializations can be done fully online. $1,575/unit × 45 units ≈ $70,875. 2027 deadline not posted: last year was Tue Dec 2, 2025, so expect ~Dec 1, 2026. Recs: 3 required (optional 4th as a backup); at least one from a professor strongly recommended. Letters must be written and submitted solely by the recommender — you must tell them this. No GRE.' },
    'seed-1': { from: '', deadline: '2026-11-10', deadlineEst: true, start: 'Spring or Fall 2027 (rolling)',
      notes: 'Fully online via CVN, rolling admissions. Program page says apply no later than 4–6 weeks before the semester (~early Dec for Spring 2027); the CVN FAQ says 10 weeks — date shown (~Nov 10) is the safer target. For Fall 2027, apply by ~late June. Needs probability, calculus, linear algebra and a programming course (C recommended); try the prerequisite questions on the program page. First 3 courses (optimization, probability & statistics, stochastic models) need B- or better to continue. 30 credits: 7 core + 3 electives (e.g. risk management, fixed income, vol smile, credit). $2,822/credit + $395/course (2026–27). Min 3.0 GPA. GRE optional.' },
    'seed-3': { from: '2026-12-03', deadline: '2026-12-03', deadlineEst: false,
      notes: 'Autumn 2027 rounds (confirmed): Dec 3 · Jan 14 · Mar 25 — recs and test scores due by the deadline too. Online program also starts in Jan & Jun: Jan 2027 deadline not posted (last year Nov 6, so ~Nov 5). 1,250 units (12.5 courses) at $7,862/course (2025–26 rate). Online classes weekday evenings 6–9pm; part-time can be 1 course/quarter (~3 yrs). Needs multivariable calc, linear algebra, probability, programming.' },
    'seed-4': { from: '', deadline: '2027-01-13', deadlineEst: false,
      notes: 'Targeting Round 2 (Jan 13). Rounds (official): R1 Oct 14, 2026 · R2 Jan 13, 2027 · R3 Mar 3 · R4 May 5 · R5 rolling — all for the Aug 2027 start. Two-step application: Phase 1 takes minutes and you hear back within 10 business days. ~20 months, 108 units at $718/unit (2026–27). On-campus BaseCamp + capstone; Analytics Immersion optional. No fee; GMAT/GRE optional; optional extra essay.' },
    'seed-5': { from: '2027-06-23', deadline: '2026-11-09', deadlineEst: false,
      notes: 'In-person deadlines (official): Nov 9 (1st priority) · Dec 7 (2nd) · Mar 4 · May 6 · final Jun 23, 2027 — decisions ~1–2 months after each; priority rounds matter for scholarships. Online program: single final deadline Jun 23, 2027, rolling decisions. All tracks start in Autumn. $6,384/course (2025–26 rate; rises 3–7%/yr); $1,500 deposit if admitted. One video required, a second is optional. Info sessions: online program Sep 28, in-person Oct 22 (5–6pm CT).' },
    'seed-6': { from: '2027-03-15', deadline: '2027-03-15', deadlineEst: false,
      notes: 'Fall 2027 (confirmed): priority review Feb 1, final Mar 15. 36 credits at $343/credit for out-of-state US students (~$12.3k) plus an online learning fee each semester ($212–$531). Needs calc, linear algebra, prob/stats, programming. GRE optional. Fee $95.' },
    'seed-7': { from: '', deadline: '', deadlineEst: false,
      notes: 'Run by CS + Statistics & Data Sciences. Fall 2027 dates not posted — applications open ~Dec, priority deadline ~April, final ~May. Spring 2027 deadline (Sep 1) passed. 30 credits (10 courses) at $1,000/course. No GRE. Min 3.0 GPA.' },
  };
  // Online-only (user can only do online programs). from = starter deadlines this may replace.
  const ONLINE_UPDATES = {
    'seed-0': { format: 'Online (HCP)' },
    'seed-3': { format: 'Online', start: 'Jan or Jun 2027', from: ['2026-12-03', ''], deadline: '2026-11-05', deadlineEst: true,
      notes: 'Online program: live classes weekday evenings 6–9pm; online starts are Jan and Jun. Offers go out on a rolling basis, with no advantage to earlier rounds. Jan 2027 deadline not posted — last year Nov 6, so ~Nov 5 (est.); Jun 2027 start ~late Apr (last year Apr 30). Part-time can be 1 course/quarter (~3 yrs). Recs: 2 required, 3 strongly recommended for FinMath; clicking “Send to Recommender” in the portal emails them a link right away, and they see whether you waived your right to view the letter. 1,250 units (12.5 courses) at $7,862/course (2025–26 rate). Needs multivariable calc, linear algebra, probability, programming.' },
    'seed-5': { format: 'Online', start: 'Autumn 2027', from: ['2026-11-09', '2026-12-03', ''], deadline: '2027-06-23', deadlineEst: false,
      notes: 'Online program (official): one final deadline, Jun 23, 2027, with rolling decisions — applying earlier gets an earlier answer. Starts Autumn 2027; part-time is 2 courses/quarter with live evening/Saturday classes. $6,384/course (2025–26 rate; rises 3–7%/yr); $1,500 deposit if admitted. One video required, a second is optional. Recs: 2 required (extra letters welcome); clicking “Send to Recommender” in the portal emails them a link right away. Online info session Sep 28, 5–6pm CT.' },
    'seed-7': { cost: '$10k + fees', from: [''], deadline: '2027-03-15', deadlineEst: false,
      notes: 'Fall 2027 (official): application opens Dec 15; priority deadline Mar 15, final Apr 15. Applying is a two-step process — submit the UT Austin application before the priority deadline so materials are processed in time. Run by Statistics & Data Science + Computer Science. 10 courses: gateway Principles of Data Science; core Data Structures & Algorithms, Machine Learning, Probability & Inference, Regression & Predictive Modeling; 2 stats electives + 3 ML/AI electives (e.g. Deep Learning, NLP, Optimization, Reinforcement Learning, Causal Inference). $10,000 + fees. No GRE. Min 3.0 GPA.' },
  };
  // How each program reviews applications (verified Sept 2026)
  const REVIEW = {
    'seed-10': 'Rolling, firm deadline',
    'seed-0': 'Fixed deadline',
    'seed-1': 'Rolling',
    'seed-2': 'Rolling, firm deadline',
    'seed-3': 'Rounds, rolling offers',
    'seed-4': 'Rounds (R5 rolling)',
    'seed-5': 'Rolling, firm deadline',
    'seed-6': 'Rolling, firm deadline',
    'seed-7': 'Fixed deadline',
    'seed-8': 'Quarterly batches',
    'seed-9': 'Fixed deadline',
  };
  // Recommenders lined up (Sept 28): Daan (current manager) and Dan (former manager) said yes
  const ASK_RECS = 'Ask recommenders — Daan & Dan said yes, details sent (letters by Oct 17)';
  const REC_UPDATES = {
    'seed-2': { 'Rec 1: current direct supervisor': 'Rec 1: Daan (direct supervisor)', 'Rec 2 (professional)': 'Rec 2: Dan' },
    'seed-3': { 'Rec 1': 'Rec 1: Daan', 'Rec 2': 'Rec 2: Dan', 'Rec 3 (strongly recommended)': 'Rec 3: TBD (strongly recommended)' },
    'seed-1': { 'Rec 1': 'Rec 1: Daan', 'Rec 2': 'Rec 2: Dan', 'Rec 3': 'Rec 3: TBD (required)' },
    'seed-10': { 'Rec 1': 'Rec 1: Daan', 'Rec 2': 'Rec 2: Dan' },
  };
  function applyRecs(a) {
    const names = REC_UPDATES[a.id];

    if (col && col.recs) {
      const prev = Object.fromEntries(col.recs.people.map(x => [x.name, x.status]));
      col.recs = structuredClone(RECS['seed-1']);
      for (const x of col.recs.people) if (prev[x.name]) x.status = prev[x.name];
    }
    // rev 26/27: letter guidance (Berkeley exactly 2, UChicago no max, Columbia 4th unknown); refresh rec boxes, keep statuses the user set
    if (rev < 27) for (const id of ['seed-10', 'seed-2', 'seed-3', 'seed-1']) {
      const a = list.find(x => x.id === id);
      if (!a || !a.recs) continue;
      const prev = Object.fromEntries(a.recs.people.map(x => [x.name, x.status]));
      a.recs = structuredClone(RECS[id]);
      for (const x of a.recs.people) if (prev[x.name]) x.status = prev[x.name];
    }
    // rev 29: Adam Loy asked (Sept 29) for Penn, UChicago FinMath, Columbia; only moves status forward
    if (rev < 29) for (const a of list) for (const x of (a.recs?.people || []))
      if (x.name === 'Adam Loy' && x.status === 'Not asked') x.status = 'Asked';
    // rev 28: Laura Chihara confirmed (Agreed) for UChicago FinMath + Columbia
    if (rev < 28) for (const id of ['seed-3', 'seed-1']) {
      const a = list.find(x => x.id === id);
      if (!a || !a.recs) continue;
      const prev = Object.fromEntries(a.recs.people.map(x => [x.name, x.status]));
      a.recs = structuredClone(RECS[id]);
      for (const x of a.recs.people) if (prev[x.name]) x.status = prev[x.name];
      // Force Laura to Agreed if she was Not asked
      const laura = a.recs.people.find(x => x.name === 'Laura Chihara');
      if (laura && laura.status === 'Not asked') laura.status = 'Agreed';
    }
    // rev 30: Berkeley MIDS official requirements (renames keep ticks)
    if (rev < 30) list.forEach(applyBerkeley);
    // rev 31: Berkeley transcript ordered
    if (rev < 31) list.forEach(applyTranscriptOrdered);
    // rev 4: starting prestige rank
    for (const seed of SEED) {
      const a = list.find(x => x.id === seed.id);
      if (a && a.rank == null) a.rank = seed.rank;
    }
    return list;
  }
  function save() {
    try { localStorage.setItem(REV_KEY, SEED_REV); } catch {}
    try { localStorage.setItem(KEY, JSON.stringify(apps)); } catch {}
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function daysUntil(d) {
    if (!d) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((new Date(d + 'T00:00:00') - today) / 86400000);
  }
  const fmt = (d, year) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}) });
  const progress = a => [(a.reqs || []).filter(q => q.done).length, (a.reqs || []).length];
  const feeText = a => a.fee === '' || a.fee == null ? '' : Number(a.fee) ? '$' + a.fee : 'none';

  function dueHtml(a) {
    if (!a.deadline) return `<div class="due none">${esc(a.start) === 'Rolling' ? 'Rolling' : 'TBD'}</div>`;
    const n = daysUntil(a.deadline);
    if (!PRE_SUBMIT.has(a.status)) return `<div class="due none">${a.deadlineEst ? '~' : ''}${fmt(a.deadline)}</div>`;
    const cls = n < 0 ? 'late' : n <= 14 ? 'soon' : '';
    const rel = n < 0 ? `${-n}d ago` : n === 0 ? 'today' : `${n}d left`;
    return `<div class="due ${cls}">${a.deadlineEst ? '~' : ''}${fmt(a.deadline)}<small>${rel}${a.deadlineEst ? ' · est.' : ''}</small></div>`;
  }

  function ring(done, all) {
    const c = 2 * Math.PI * 14, pct = all ? done / all : 0;
    return `<div class="ring ${all && done === all ? 'full' : ''}">
      <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--surface2)" stroke-width="3.5"/>
      <circle cx="17" cy="17" r="14" fill="none" stroke="var(--green)" stroke-width="3.5" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/></svg>
      <span>${done}/${all}</span></div>`;
  }

  function sorted() {
    return [...apps].sort((a, b) =>
      (DECIDED.has(a.status) - DECIDED.has(b.status)) ||
      (sortBy === 'rank' ? (+a.rank || 99) - (+b.rank || 99) : 0) ||
      (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  }

  function render() {
    const submitted = apps.filter(a => !PRE_SUBMIT.has(a.status)).length;
    const admits = apps.filter(a => a.status === 'Admitted' || a.status === 'Committed').length;
    const next = apps.filter(a => PRE_SUBMIT.has(a.status) && a.deadline && daysUntil(a.deadline) >= 0)
      .sort((a, b) => a.deadline.localeCompare(b.deadline))[0];
    $('summary').innerHTML = [
      `${apps.length} programs`, `${submitted} submitted`, `${admits} admits`,
      next && `Next: <b>${esc(next.school)}</b> in ${next.deadlineEst ? '~' : ''}${daysUntil(next.deadline)}d`,
    ].filter(Boolean).join(' · ');

    document.querySelector('.wrap').classList.toggle('wide', view === 'table' || view === 'essay');
    $('sortSeg').style.display = view === 'essay' ? 'none' : '';
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === sortBy));
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    if (view === 'essay') { $('main').innerHTML = renderEssay(); return; }
    if (!apps.length) { $('main').innerHTML = `<div class="list"><div class="empty">No programs yet — click <b>+ Add program</b>.</div></div>`; return; }
    $('main').innerHTML = view === 'table' ? renderTable() : `<div class="list">${sorted().map(renderProg).join('')}</div>`;
  }

  const ESSAY = [
    ['Intro frame: the roll story', 'Motivation · WriteIvy §1', 200,
      'As a [Market Data Systems Engineer] at DRW, I built [one of the pipelines] that tells traders how and when to roll their futures positions out of the expiring contract and into the next.',
      ['What you built, in plain words',
       'What happened: a portfolio manager saw the spread price gap flip from positive to negative',
       'The cause: you traced it to a single anomalous quote; 24 hours gave illiquid spreads enough quotes but let anomalies in',
       'Your fix: a judgment call to switch to 10am–12pm',
       'The insight: a PM rolling a position and a researcher studying the order book define "accurate" differently; some anomalies are errors, some are real market events',
       'Sentence of purpose: MIDS to learn statistically backed methods to tell real market moves from bad data, instead of relying on judgment calls',
       'Keep it general: nothing proprietary']],
    ['Why MIDS: courses and capstone', 'Intellectual fit · WriteIvy §2', 150,
      '[Statistics for Data Science] would give me the tools to test decisions like [the averaging window] instead of making them on judgment.',
      ['2–3 courses, each tied to your problem: Statistics for Data Science (test choices), Applied Time Series (market data is time series, where anomaly detection lives), Applied Machine Learning (model data the way quants do)',
       'Capstone idea: a model that classifies anomalous quotes as data errors or real market events, on public market data',
       'Professors: optional; only if you have read their work and it truly connects']],
    ['Why MIDS: focus area and format', 'Intellectual fit · WriteIvy §2', 125,
      'The [Applied Statistics and Decision Science] focus area fits [what I already do every day]: [deciding which data to trust and explaining why].',
      ['Focus area: Applied Statistics and Decision Science (rigor, uncertainty, communicating to stakeholders)',
       'Online on the standard path while working; apply each course at DRW right away',
       'Immediate payoff: more robust day-to-day data quality work',
       'What you bring to classmates: six years with market data at exchanges and a trading firm']],
    ['Why qualified: your best work', 'Aptitude · WriteIvy §3', 200,
      'Beyond the roll system, I curate the historical market data that [300+] quants, traders, and researchers rely on, and the hardest part is [what].',
      ['A different project from the intro: data curation and quality checks',
       'What made it hard, the judgment calls you made, the result',
       'Show what you already have: deep market data knowledge plus the engineering to build pipelines']],
    ['Why qualified: your path', 'Preparation · WriteIvy §3', 175,
      'I graduated from Carleton six years ago with a math degree focused on statistics, where [a course like Statistical Consulting, or the hot wings permutation test in MATH 275] taught me [what clicked].',
      ['Carleton: one concrete course or project, not a list',
       'Nasdaq: daily checks that flagged index discrepancies before they reached clients',
       'Cboe: automated validation for the quarterly index rebalance',
       'DRW: data quality for 300+ quants, traders, and researchers',
       'One or two sentences per stage, each about catching data problems, not duties']],
    ['Concluding frame: career goal', 'Career goals · WriteIvy §4', 125,
      'After MIDS, I want to sit with a trading desk as a [title], [researching and building signals] from data I [understand better than anyone].',
      ['Career goal (2–3 sentences): a title, at DRW or a firm like it, and why',
       'The progression: data quality now → research → building signals on a desk',
       'Why you: few people combine the pipelines, the market data knowledge, and the data science',
       'Echo the intro: next time, you would test the window choice instead of judging it',
       'Optional last line: you can\'t have perfect data, but you can have perfect knowledge of it']],
  ];

  function renderEssay() {
    return `
      <div class="essay-head">
        <h2>Berkeley MIDS statement of purpose</h2>
        <blockquote>Describe your aptitude and motivation for graduate study in Data Science, including your preparation for this field of study and your future career goals. Be specific about why the UC Berkeley MIDS program would be a good intellectual fit for you. 1–2 pages recommended.</blockquote>
        <ul>
          <li><b>Structure (WriteIvy):</b> intro frame narrative → why MIDS (2 paragraphs) → why I'm qualified (2 paragraphs) → concluding frame</li>
          <li><b>Length:</b> about 975 words</li>
          <li><b>Sub-niche:</b> telling real market moves from bad data, with statistically backed methods instead of judgment calls; later, building signals</li>
          <li><b>Tone:</b> plain and specific; tools only where the story needs them</li>
          <li><b>Find-and-replace test:</b> swap in another school's name; if paragraphs 2–3 still work, they're too generic</li>
          <li><b>Reuse for Penn:</b> paragraphs 1, 4, 5 and 6 carry over; rewrite 2–3 for Penn and add community and 15-hours-a-week sections</li>
          <li>The example sentences are placeholders: fill in the brackets and rewrite them in your own words</li>
        </ul>
      </div>
      <div class="table-wrap">
        <table class="essay">
          <thead><tr><th>#</th><th>Paragraph</th><th>Example first sentence</th><th>What it should contain</th></tr></thead>
          <tbody>${ESSAY.map(([name, el, words, first, items], i) => `
            <tr>
              <td class="n">${i + 1}</td>
              <td class="para"><b>${esc(name)}</b><span>${esc(el)} · ~${words} words</span></td>
              <td class="first">${esc(first)}</td>
              <td><ul>${items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function renderProg(a) {
    const [done, all] = progress(a);
    const facts = [
      a.start && `Start <b>${esc(a.start)}</b>`,
      a.deadline && `Deadline <b>${a.deadlineEst ? '~' : ''}${fmt(a.deadline, true)}${a.deadlineEst ? ' (est.)' : ''}</b>`,
      feeText(a) && `Fee <b>${feeText(a)}</b>`,
      a.cost && `Cost <b>${esc(a.cost)}</b>`,
    ].filter(Boolean).join(' · ');
    return `
      <div class="prog ${open.has(a.id) ? 'open' : ''} ${DECIDED.has(a.status) ? 'decided' : ''} ${a.status === 'Preparing' ? 'preparing' : ''}" data-id="${a.id}">
        <div class="row" data-toggle>
          ${ring(done, all)}
          <div class="name"><b>${a.rank ? `<i class="rank">#${esc(a.rank)}</i> ` : ''}${esc(a.school)}</b><span>${esc(a.program)}${a.format ? ' · ' + esc(a.format) : ''}${a.review ? ' · ' + esc(a.review) : ''}</span></div>
          <span class="pill s-${a.status.toLowerCase()}">${esc(a.status)}</span>
          ${dueHtml(a)}
          <span class="chev">›</span>
        </div>
        <div class="body">
          <ul class="items">
            ${(a.reqs || []).map((q, i) => `
              <li class="${q.done ? 'done' : ''}">
                <input type="checkbox" id="c-${a.id}-${i}" data-i="${i}" ${q.done ? 'checked' : ''}>
                <label for="c-${a.id}-${i}">${esc(q.t)}</label>
                <button class="del" data-del="${i}" title="Remove">×</button>
              </li>`).join('')}
          </ul>
          <input class="add-item" placeholder="+ Add item" data-add>
          ${renderRecs(a)}
          <div class="info">
            ${facts}
            ${a.notes ? `<div class="note">${esc(a.notes)}</div>` : ''}
          </div>
          <div class="actions">
            <select data-status aria-label="Status">${STATUSES.map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
            <button class="btn small" data-edit>Edit</button>
            ${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Program page ↗</a>` : ''}
          </div>
        </div>
      </div>`;
  }

  function renderRecs(a) {
    if (!a.recs) return '';
    const r = a.recs;
    const cls = s => s === 'Submitted' ? 'st-submitted' : s === 'Registered in portal' ? 'st-registered' : s === 'Agreed' ? 'st-agreed' : '';
    return `<div class="recbox">
      <div class="recbox-head"><span>Recommendation letters</span>${r.confirmed ? '<span class="ok">✓ Confirmed in application</span>' : ''}</div>
      <ul class="rules">${r.rules.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      <div class="recpeople">${r.people.map((p, i) => `
        <div class="recperson"><b>${esc(p.name)}</b><span>${esc(p.role)}</span>
          <select class="${cls(p.status)}" data-recstatus="${i}" aria-label="${esc(p.name)} status">
            ${REC_STATUSES.map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select></div>`).join('')}
      </div>
    </div>`;
  }

  function renderTable() {
    return `<div class="table-wrap"><table>
      <thead><tr><th>Rank</th><th>Program</th><th>Deadline</th><th>Start</th><th>Format</th><th>Review</th><th>Fee</th><th>Cost</th><th>Done</th><th>Status</th></tr></thead>
      <tbody>${sorted().map(a => {
        const [done, all] = progress(a);
        return `<tr data-row="${a.id}">
          <td>${a.rank ? '#' + esc(a.rank) : '—'}</td>
          <td class="school"><b>${esc(a.school)}</b><span>${esc(a.program)}</span></td>
          <td>${a.deadline ? (a.deadlineEst ? '~' : '') + fmt(a.deadline, true) + (a.deadlineEst ? ' (est.)' : '') : (a.start === 'Rolling' ? 'Rolling' : 'TBD')}</td>
          <td>${esc(a.start)}</td>
          <td>${esc(a.format)}</td>
          <td>${esc(a.review || '')}</td>
          <td>${feeText(a) || '—'}</td>
          <td>${esc(a.cost)}</td>
          <td>${done}/${all}</td>
          <td><span class="pill s-${a.status.toLowerCase()}">${esc(a.status)}</span></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  const appOf = el => apps.find(a => a.id === el.closest('[data-id]')?.dataset.id);

  $('main').addEventListener('click', e => {
    const row = e.target.closest('tr[data-row]');
    if (row) { openDialog(row.dataset.row); return; }
    const a = appOf(e.target);
    if (!a) return;
    if (e.target.closest('[data-toggle]')) {
      open.has(a.id) ? open.delete(a.id) : open.add(a.id);
      render();
    } else if (e.target.dataset.del != null) {
      a.reqs.splice(+e.target.dataset.del, 1);
      save(); render();
    } else if (e.target.closest('[data-edit]')) {
      openDialog(a.id);
    }
  });

  $('main').addEventListener('change', e => {
    const a = appOf(e.target);
    if (!a || e.target.dataset.add != null) return;
    if (e.target.type === 'checkbox') {
      const q = a.reqs[+e.target.dataset.i];
      q.done = e.target.checked;
      // Ticking items nudges status forward: first tick → Preparing, "Submitted" → Submitted
      if (q.done && /^submitted$/i.test(q.t) && PRE_SUBMIT.has(a.status)) a.status = 'Submitted';
      else if (q.done && a.status === 'Researching') a.status = 'Preparing';
    } else if (e.target.dataset.recstatus != null) {
      a.recs.people[+e.target.dataset.recstatus].status = e.target.value;
    } else if (e.target.dataset.status != null) {
      a.status = e.target.value;
    }
    save(); render();
  });

  $('main').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.dataset.add == null) return;
    const t = e.target.value.trim();
    if (!t) return;
    const a = appOf(e.target);
    a.reqs = a.reqs || [];
    a.reqs.push({ t, done: false });
    save(); render();
    document.querySelector(`[data-id="${a.id}"] [data-add]`)?.focus();
  });

  $('sortSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    sortBy = b.dataset.sort;
    try { localStorage.setItem(SORT_KEY, sortBy); } catch {}
    render();
  });

  $('viewSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    view = b.dataset.view;
    try { localStorage.setItem(VIEW_KEY, view); } catch {}
    render();
  });

  // Add / edit dialog
  $('statusSel').innerHTML = STATUSES.map(s => `<option>${s}</option>`).join('');
  function openDialog(id = null) {
    editingId = id;
    const form = $('form');
    form.reset();
    const a = id ? apps.find(x => x.id === id)
      : { status: 'Researching', reqs: r('Statement', 'Resume', 'Transcripts', 'Rec 1', 'Rec 2', 'Pay fee', 'Submitted') };
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') el.checked = !!a[el.name];
      else el.value = el.name === 'reqs' ? (a.reqs || []).map(q => q.t).join('\n') : (a[el.name] ?? '');
    }
    $('dlgTitle').textContent = id ? 'Edit program' : 'Add program';
    $('deleteBtn').hidden = !id;
    $('dlg').showModal();
  }
  $('addBtn').onclick = () => openDialog();
  $('cancelBtn').onclick = () => $('dlg').close();
  $('form').addEventListener('submit', () => {
    const data = Object.fromEntries(new FormData($('form')));
    data.deadlineEst = !!data.deadlineEst;
    const existing = editingId && apps.find(x => x.id === editingId);
    const wasDone = new Set((existing?.reqs || []).filter(q => q.done).map(q => q.t));
    data.reqs = data.reqs.split('\n').map(t => t.trim()).filter(Boolean).map(t => ({ t, done: wasDone.has(t) }));
    if (existing) Object.assign(existing, data);
    else {
      const id = crypto.randomUUID?.() || String(Date.now());
      apps.push({ id, ...data });
      open.add(id);
    }
    save(); render();
  });
  $('deleteBtn').onclick = () => {
    const a = apps.find(x => x.id === editingId);
    if (!confirm(`Delete ${a.school} ${a.program}?`)) return;
    apps = apps.filter(x => x.id !== editingId);
    save(); render(); $('dlg').close();
  };

  // Backup
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(apps, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: `grad-apps-${new Date().toISOString().slice(0, 10)}.json` }).click();
    URL.revokeObjectURL(url);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error();
      if (apps.length && !confirm(`Replace your ${apps.length} saved program(s) with ${data.length} from the backup?`)) return;
      apps = data; save(); render();
    } catch { alert('That file is not a valid backup.'); }
    e.target.value = '';
  };

  // Open the nearest deadline by default
  const first = sorted()[0];
  if (first) open.add(first.id);
  render();
</script>
</body>
</html>
